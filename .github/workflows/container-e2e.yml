name: Container E2E

on:
  push:
    branches:
      - main
      - self-contained-backend
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Log pinned base image digest
        run: |
          base_image="$(sed -n 's/^ARG NODE_BASE_IMAGE=//p' Dockerfile | head -n1)"
          echo "Dockerfile base image ref: ${base_image}"
          docker pull "${base_image}"
          docker inspect "${base_image}" --format 'Resolved digest: {{index .RepoDigests 0}}'

      - name: Single-image browser E2E
        run: npm run e2e:container

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
